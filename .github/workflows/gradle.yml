# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvmTest
            os: ubuntu-latest
          - target: linuxX64Test
            os: ubuntu-latest
          - target: testAndroidHostTest
            os: ubuntu-latest
          - target: iosSimulatorArm64Test
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - run: ./gradlew ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ matrix.target }}
          path: library/build/reports/tests/
          retention-days: 7

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit of a pull request and its first parent, the base branch.
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Check the public API dump
        run: ./gradlew checkKotlinAbi
      - name: Check that API.md is updated with the public API
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -q '^library/api/' <<< "$changed" && ! grep -qx 'API.md' <<< "$changed"; then
            echo "::error file=API.md::The public API in library/api/ changed, but API.md did not. Update API.md."
            exit 1
          fi